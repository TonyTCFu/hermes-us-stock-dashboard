services:
  - type: web
    name: hermes-us-stock-dashboard
    runtime: python
    plan: free
    region: singapore  # 亞洲節點，台灣延遲最低
    branch: main
    buildCommand: ""
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DATA_DIR
        value: /tmp/data  # Render 容器每次重啟會清空，所以用 /tmp
      - key: STOCK_UNIVERSE
        value: AAPL,MSFT,GOOGL,AMZN,META,NVDA,TSLA,JPM,V,MA,UNH,JNJ,PG,KO,PEP,HD,MCD,NKE,DIS,BA,CAT,GE,XOM,CVX,ABBV,LLY,TMO,AVGO,ADBE,CRM,NFLX,ACN,CSCO,INTC,AMD,IBM,ORCL,SAP,TM
      - key: BENCHMARK_TICKER
        value: SPY
      - key: RISK_FREE_RATE
        value: "0.05"
      - key: INITIAL_CAPITAL
        value: "100000"
      - key: TRANSACTION_COST
        value: "0.001"
      - key: SLIPPAGE
        value: "0.0005"
      - key: REBALANCE_FREQUENCY
        value: biweekly
      - key: MAX_HOLDING
        value: "15"
      - key: FACTOR_WEIGHTS
        value: momentum:0.15,value:0.10,quality:0.15,low_vol:0.10,size:0.05,div_yield:0.05,revenue_growth:0.10,industry_momentum:0.10,flow:0.10,fx_exposure:0.10
      # ── Alpaca Secrets (在 Render 後台設，**不要 commit 到 git**) ──
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets