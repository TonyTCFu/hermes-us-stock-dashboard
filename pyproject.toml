[project]
name = "us-stock-quant"
version = "0.1.0"
description = "美國股市量化投資分析平台 — 多因子模型、回測、組合最佳化"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pyportfolioopt>=1.5.5",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "quantstats>=0.0.62",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["us_quant*"]
